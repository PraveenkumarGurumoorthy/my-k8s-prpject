name: Kubernetes CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Run Kubeconform Strict Validation (CI)
      uses: yannh/kubeconform-action@v4
      with:
        files: k8s/
        strict: true